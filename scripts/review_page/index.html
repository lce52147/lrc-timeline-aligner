<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>LRC review</title>
<style>
:root{font:14px system-ui,sans-serif;color:#202124;background:#f6f7f9}body{margin:0}header{position:sticky;top:0;background:white;border-bottom:1px solid #ddd;padding:10px 16px;z-index:2}button,select{font:inherit;padding:5px 8px}button{cursor:pointer}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{color:#666}.queue{max-width:1050px;margin:12px auto}.song{background:#fff;border:1px solid #ddd;border-radius:6px;margin:10px 0;overflow:hidden}.song h2{font-size:15px;margin:0;padding:10px;background:#f0f2f5}.row{padding:10px;border-top:1px solid #eee}.row.review{border-left:4px solid #d33}.row.untrusted{border-left:4px solid #e09800}.meta{color:#666;font-size:12px}.lyric{font-size:16px;margin:4px 0 8px}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{border:1px solid #bbb;background:#fff;border-radius:15px;padding:3px 8px}.chip.selected{background:#dcecff;border-color:#3880d0}.chip.rejected{text-decoration:line-through;color:#888}.warning{color:#b42318}.muted{color:#777}.dirty{background:#fff4ce}
</style></head>
<body>
<header><div class="toolbar"><button id="save">Save</button><label><input id="untrusted" type="checkbox"> show UNTRUSTED</label><span id="status" class="status">loading</span></div><div class="meta">Keys: 1-9 choose candidate, J/K move, Space play, Ctrl+S save</div></header>
<main id="queue" class="queue"></main>
<script>
(() => {
  const token=new URLSearchParams(location.search).get('t')||new URLSearchParams(location.hash.slice(1)).get('t')||'', queue=document.getElementById('queue'), status=document.getElementById('status');
  const state={songs:[],rows:[],edits:new Map(),dirty:false,selected:0,showUntrusted:false};
  const api=async(path,options={})=>{const headers=Object.assign({'X-Review-Token':token},options.headers||{});const r=await fetch(path,Object.assign({},options,{headers}));const data=await r.json().catch(()=>({error:r.statusText}));if(!r.ok)throw Error(data.error||r.statusText);return data;};
  const time=cs=>cs==null?'—':`${Math.floor(cs/6000).toString().padStart(2,'0')}:${Math.floor(cs%6000/100).toString().padStart(2,'0')}.${(cs%100).toString().padStart(2,'0')}`;
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const visible=()=>state.rows.filter(x=>x.row.review==='REVIEW'||state.showUntrusted);
  function render(){const rows=visible();state.selected=Math.min(state.selected,Math.max(0,rows.length-1));queue.innerHTML='';const grouped=new Map();rows.forEach(x=>{if(!grouped.has(x.song.index))grouped.set(x.song.index,[]);grouped.get(x.song.index).push(x);});grouped.forEach(items=>{const box=document.createElement('section');box.className='song';box.innerHTML=`<h2>${esc(items[0].song.song)} <span class="meta">${items.length} flagged rows</span></h2>`;items.forEach(x=>box.appendChild(rowElement(x)));queue.appendChild(box);});status.textContent=`${rows.length} visible / ${state.rows.length} total${state.dirty?' · unsaved':''}`;status.className=state.dirty?'status dirty':'status';}
  function rowElement(item){const {song,row}=item,key=`${song.index}:${row.entry}`,edit=state.edits.get(key),chosen=edit?edit.cs:row.current_cs,div=document.createElement('article');div.className=`row ${row.review.toLowerCase()}`;div.dataset.key=key;const chips=(row.candidates||[]).map((c,i)=>`<button class="chip ${c.rejected?'rejected ':''}${c.cs===chosen?'selected':''}" data-cs="${c.cs}" data-source="${esc((c.sources||[c.label]).join(','))}">${i+1}: ${time(c.cs)} <span class="meta">${esc((c.sources||[c.label]).join(','))}</span></button>`).join('');div.innerHTML=`<div class="meta">${esc(song.song)} · entry ${row.entry} · ${esc(row.review)} · rank ${esc(row.severity_rank??'—')} · ${esc(row.reason||'')}</div><div class="lyric">${esc(row.lyric)}</div><div>current <b>${time(row.current_cs)}</b> · auto ${time(row.auto_cs)} · prev ${time(row.previous==null?null:Math.round(row.previous*100))} · next ${time(row.next==null?null:Math.round(row.next*100))}</div><div><button class="play" data-kind="flac">play FLAC</button> <button class="play" data-kind="stem">play stem</button></div><div class="chips">${chips||'<span class="muted">no candidates</span>'}</div><div class="meta">${song.read_only?`read-only: ${esc(song.read_only_reason||'unknown')}`:''}</div>`;div.querySelectorAll('.play').forEach(b=>b.addEventListener('click',()=>new Audio(`/audio/${song.index}/${b.dataset.kind}?t=${encodeURIComponent(token)}`).play().catch(()=>{})));div.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{if(song.read_only)return;const cs=Number(b.dataset.cs);state.edits.set(key,{entry:row.entry,cs,source:b.dataset.source.slice(0,64),nudge_cs:cs-row.current_cs});state.dirty=true;render();}));div.addEventListener('click',()=>{state.selected=visible().findIndex(v=>v===item);document.querySelectorAll('.row').forEach(r=>r.style.outline='');div.style.outline='2px solid #3880d0';});return div;}
  async function load(){try{const list=await api('/api/songs'),details=await Promise.all(list.map(s=>api(`/api/song/${s.index}`)));state.songs=list;state.rows=[];details.forEach((song,i)=>(song.rows||[]).forEach(row=>state.rows.push({song:Object.assign({},list[i],{detail:song}),row})));state.rows.sort((a,b)=>(a.row.severity_rank??999999)-(b.row.severity_rank??999999)||(b.row.severity_score??0)-(a.row.severity_score??0)||a.song.index-b.song.index||a.row.entry-b.row.entry);render();}catch(e){status.textContent=e.message;status.className='warning';}}
  async function save(){if(!state.dirty)return;const bySong=new Map();state.edits.forEach((edit,key)=>{const index=Number(key.split(':')[0]);if(!bySong.has(index))bySong.set(index,[]);bySong.get(index).push(edit);});try{for(const[index,edits]of bySong){const song=state.songs.find(s=>s.index===index),detail=await api(`/api/song/${index}`);const r=await fetch(`/api/song/${index}/save`,{method:'POST',headers:{'X-Review-Token':token,'Origin':location.origin,'Content-Type':'application/json'},body:JSON.stringify({base_sha256:detail.base_sha256,edits})});if(!r.ok)throw Error((await r.json()).error||r.statusText);void song;}state.edits.clear();state.dirty=false;await load();}catch(e){status.textContent=`save failed: ${e.message}`;status.className='warning';}}
  document.getElementById('save').addEventListener('click',save);document.getElementById('untrusted').addEventListener('change',e=>{state.showUntrusted=e.target.checked;render();});
  document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='s'){e.preventDefault();save();return;}const rows=visible();if(!rows.length)return;if(e.key==='j'||e.key==='ArrowDown'){state.selected=Math.min(rows.length-1,state.selected+1);render();}if(e.key==='k'||e.key==='ArrowUp'){state.selected=Math.max(0,state.selected-1);render();}if(e.code==='Space'){e.preventDefault();const x=rows[state.selected];if(x)new Audio(`/audio/${x.song.index}/flac?t=${encodeURIComponent(token)}`).play().catch(()=>{});}if(/^[1-9]$/.test(e.key)){const x=rows[state.selected],c=x&&x.row.candidates?.[Number(e.key)-1];if(x&&c&&!x.song.read_only){state.edits.set(`${x.song.index}:${x.row.entry}`,{entry:x.row.entry,cs:c.cs,source:(c.sources||[c.label]).join(',').slice(0,64),nudge_cs:c.cs-x.row.current_cs});state.dirty=true;render();}}});
  addEventListener('beforeunload',e=>{if(state.dirty){e.preventDefault();e.returnValue='';}});load();
})();
</script></body></html>
