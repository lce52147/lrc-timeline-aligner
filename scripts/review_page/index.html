<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>LRC review</title>
<style>
:root{--bg:#0f141c;--panel:#161d28;--panel-2:#1c2533;--line:#2a3647;--fg:#e6ecf4;--fg-2:#9fb0c6;--fg-3:#6b7d95;--accent:#f2b84b;--accent-ink:#1a1304;--ok:#5ed39a;--warn:#f2b84b;--bad:#ef7a7a;--wave:#4f9be6;
  font:14px/1.5 system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--fg);background:var(--bg);color-scheme:dark}
html,body{height:100%}body{margin:0;background:var(--bg);display:flex;flex-direction:column}
button{font:inherit;padding:6px 10px;cursor:pointer;color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:6px}
button:hover:not(:disabled){border-color:var(--fg-3)}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2}
header .song-name{font-weight:600;font-size:15px}header .muted,.muted{color:var(--fg-3)}header .spacer{flex:1}
.bar{height:6px;width:140px;background:var(--panel-2);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}.bar i{display:block;height:100%;background:var(--ok)}
.status{color:var(--fg-2)}.status.dirty{color:var(--accent)}.warning{color:var(--bad)}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel-2);color:var(--fg-2)}
.layout{flex:1;display:grid;grid-template-columns:240px minmax(0,1fr);min-height:0}
@media (max-width:760px){.layout{grid-template-columns:1fr}.rail{display:none}}
.rail{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:8px}
.rail h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);margin:8px 8px 4px;font-weight:500}
.song-tab{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;border:0;background:transparent;border-radius:6px;color:var(--fg-2)}
.song-tab:hover{background:var(--panel-2)}.song-tab.active{background:var(--panel-2);color:var(--fg)}
.song-tab .dot{width:8px;height:8px;border-radius:50%;background:var(--fg-3);flex:none}.song-tab.todo .dot{background:var(--warn)}.song-tab.done .dot{background:var(--ok)}
.song-tab .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.song-tab .n{color:var(--fg-3);font-size:12px}
.work{display:flex;flex-direction:column;min-width:0;padding:14px 16px;gap:14px;overflow:auto}
.row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.row.conflict{border-color:var(--bad)}
.meta{display:flex;gap:10px;align-items:center;color:var(--fg-3);font-size:12px;flex-wrap:wrap}
.lyric{font-size:22px;line-height:1.35;font-weight:600;white-space:pre-wrap;text-wrap:balance}
.why{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--panel-2)}
.why .ic{width:18px;height:18px;border-radius:50%;background:var(--warn);color:var(--accent-ink);font-weight:600;font-size:12px;display:grid;place-items:center;flex:none;margin-top:2px}.why.ok .ic{background:var(--ok)}
.wavebox{position:relative}.peaks{display:block;width:100%;height:96px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);touch-action:none;cursor:ew-resize}
.wavenote{position:absolute;right:10px;top:8px;font-size:11px;color:var(--fg-3);pointer-events:none}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.option{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);text-align:left;min-width:0}
.option .k{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--fg-3)}.option .l{font-weight:600;font-size:15px}.option .t{color:var(--fg-2);font-size:12px}
.option.selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.option.keep .l::before{content:"● ";color:var(--ok)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.actions .primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.nudge{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.nudge button{border:0;border-radius:0}.nudge span{padding:6px 10px;background:var(--panel);color:var(--fg-2)}
.hint{color:var(--fg-3);font-size:12px;margin-left:auto}.order-warning{color:var(--bad);font-weight:600}
details.more{font-size:12px;color:var(--fg-2)}details.more summary{cursor:pointer;color:var(--fg-3)}
.candidate{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 0;border-top:1px solid var(--line)}
.candidate.selected{color:var(--fg)}.candidate.rejected{text-decoration:line-through;color:var(--fg-3)}.candidate-action{padding:2px 6px;font-size:12px}
.queue-list h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:500;margin:4px 0}
.q{display:grid;grid-template-columns:36px 76px minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--fg-2)}
.q:hover{background:var(--panel)}.q.cur{background:var(--panel);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.q .ly{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.q .st{font-size:12px;color:var(--fg-3)}.q.done .st{color:var(--ok)}.q.done .ly{opacity:.6}
.help[hidden]{display:none}.help{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:5}
.help .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 22px;max-width:440px;width:100%}
.help table{width:100%;font-size:13px}.help td{padding:4px 6px}.help td:first-child{font-family:ui-monospace,Consolas,monospace;color:var(--accent);width:100px}
.help label{display:block;margin-top:10px;color:var(--fg-2)}
</style>
</head>
<body>
<header>
  <span class="song-name" id="song-name">LRC review</span>
  <span class="muted">第 <b class="num" id="pos">0</b> / <span class="num" id="pos-total">0</span> 筆</span>
  <span class="bar"><i id="pos-bar" style="width:0%"></i></span>
  <span class="muted">本首剩 <b class="num" id="left-song">0</b> · 全部剩 <b class="num" id="left-all">0</b></span>
  <span class="spacer"></span>
  <span id="status" class="status">loading</span>
  <span id="server-mode" class="muted"></span>
  <button id="mode">音源: FLAC</button>
  <button id="save">儲存 <span class="num">Ctrl+S</span></button>
  <button id="help-button" aria-label="快捷鍵與設定">?</button>
</header>
<div class="layout">
  <nav class="rail" id="rail"></nav>
  <main id="queue" class="work"></main>
</div>
<div class="help" id="help" hidden><div class="box">
  <b>快捷鍵</b>
  <table>
    <tr><td>空白</td><td>播放目前時間點起 2 秒</td></tr>
    <tr><td>1 / 2 / 3</td><td>選 A / B / 維持並播放</td></tr>
    <tr><td>← → 或 [ ]</td><td>−0.1 / +0.1 秒（Shift：0.01 秒）</td></tr>
    <tr><td>Enter</td><td>接受目前值，跳下一筆</td></tr>
    <tr><td>K</td><td>維持原值，跳下一筆</td></tr>
    <tr><td>U</td><td>復原這筆</td></tr>
    <tr><td>↑ / ↓</td><td>上一筆 / 下一筆</td></tr>
    <tr><td>P / N</td><td>播上一句 / 下一句開頭</td></tr>
    <tr><td>B</td><td>A/B 交替比較目前值與選定值</td></tr>
    <tr><td>V</td><td>切換 FLAC / 人聲 stem</td></tr>
    <tr><td>Tab</td><td>展開 / 收起詳細</td></tr>
    <tr><td>Ctrl+S</td><td>儲存</td></tr>
  </table>
  <label><input id="untrusted" type="checkbox"> 也顯示未標記為需審的句子（UNTRUSTED）</label>
  <div style="margin-top:12px;text-align:right"><button id="help-close">關閉</button></div>
</div></div>
<script>
(() => {
  const token = new URLSearchParams(location.search).get('t') || new URLSearchParams(location.hash.slice(1)).get('t');
  const queue = document.getElementById('queue');
  const status = document.getElementById('status');
  const state = {songs:[], rows:[], edits:new Map(), peaks:new Map(), decoded:new Map(), done:new Set(), dirty:false, selected:0, activeSong:null, showUntrusted:false, mode:'flac', details:false, player:{audio:new Map(), handlers:new Map(), seq:0, timer:null, active:null, ab:null}, error:'', notice:''};
  const api = async (path, options={}) => {
    const headers = Object.assign({'X-Review-Token':token}, options.headers || {});
    const response = await fetch(path, Object.assign({}, options, {headers}));
    const data = await response.json().catch(() => ({error:response.statusText}));
    if (!response.ok) throw Error(data.error || response.statusText);
    return data;
  };
  const time = cs => cs == null ? '—' :
    String(Math.floor(cs/6000)).padStart(2,'0') + ':' + String(Math.floor(cs%6000/100)).padStart(2,'0') + '.' + String(cs%100).padStart(2,'0');
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const visible = () => state.rows.filter(item => (state.activeSong == null || item.song.index === state.activeSong) && (item.row.review === 'REVIEW' || state.showUntrusted));
  const keyFor = item => String(item.song.index) + ':' + String(item.row.entry);
  const editFor = item => state.edits.get(keyFor(item));
  const conflicted = item => { const edit = editFor(item); return !!edit && edit.base_cs !== item.row.current_cs; };
  const working = item => editFor(item)?.cs ?? item.row.current_cs;
  const isDone = item => state.done.has(keyFor(item));
  const pendingOf = song => state.rows.filter(item => item.song.index === song.index && item.row.review === 'REVIEW').length;
  const leftOf = song => state.rows.filter(item => item.song.index === song.index && item.row.review === 'REVIEW' && !isDone(item)).length;
  const deltaText = delta => (delta < 0 ? '提早 ' : '延後 ') + Math.abs(delta / 100).toFixed(1) + ' 秒';
  const sourceText = c => (c.sources || [c.label]).join(',');
  const sourceLabel = source => ({
    'audio-validated-current':'audio-checked result', auto:'current result', current:'current result',
    'raw_asr':'ASR diagnostic hint', 'precentral-recommendation':'ASR diagnostic hint',
    'ctc-acoustic-backtrack':'CTC audio candidate', 'ctc-current':'CTC current candidate',
    'ctc-first-token':'CTC first-sound candidate', 'ctc-first-token-posterior':'CTC first-sound (posterior)',
    'ctc-joint-boundary-consensus':'CTC boundary candidate', 'ctc-local-window':'CTC local-window candidate',
    'ctc-local-window-wide':'CTC wide-window candidate', 'ctc-nearby-phonetic-peak':'nearby sound candidate',
    'ctc-opening-local-retry':'opening retry candidate', 'ctc-opening-vocal-fusion':'opening voice candidate',
    'ctc-vocal-activity-reentry':'voice re-entry candidate', 'ctc-vocal-onset-confirmed':'voice-onset candidate'
  }[source] || String(source || 'candidate').replace(/^ctc-/, 'CTC ').replace(/-/g, ' '));
  const sourceLabels = c => (c.sources || [c.label]).map(sourceLabel).join(', ');
  const reasonLabels = {
    'F1-vocal-absent':'人聲缺失', 'F3-compressed-or-nonmonotonic':'歌詞時間壓縮或非單調',
    'F3-nonmonotonic':'歌詞時間非單調', 'F4-ctc-final-disagreement':'CTC 最終時間不一致',
    'candidate_disagreement':'候選時間不一致', 'ctc_confidence_collapse':'CTC 信心塌陷',
    'ctc_zero_gap_compressed_prefix':'CTC 零間隔壓縮前綴', 'duplicate_occurrence_offset_mismatch':'重複段落偏移不一致',
    'group_placement_unsupported':'分組定位無法支援', 'insufficient-minimum-proof':'最低證據不足',
    'model-disagreement':'模型結果不一致', 'no-strict-opening-proof':'缺少嚴格起音證據',
    'nonmonotonic-line-start':'行起點非單調', 'phonetic_anchor_disagreement':'語音錨點不一致',
    'previous-tail-overlap':'前行尾端重疊', 'previous-tail-ownership-unknown':'前行尾端歸屬不明',
    'recurrence-uncorroborated':'重複段落未獲交叉驗證', 'silent-risk:selected-confidence-le-0.8-and-next-gap-ge-19':'低信心且後方間隔過大',
    'tail-conflict-without-independent-current-opening':'尾端衝突且缺少目前行獨立起音', 'temporal-incoherence':'時間關係不一致',
    'timing-evidence-unverified':'時間證據未驗證', 'unresolved-material-alternative':'仍有重大候選未解決',
    'unresolved-precentral-disagreement':'前置模型仍有不一致', 'unresolved_raw_ctc_disagreement':'Raw ASR 與 CTC 仍有不一致',
    'unverified':'尚未驗證'
  };
  const reasonText = (codes, row) => {
    const values = Array.isArray(codes) ? codes : codes == null ? [] : [codes];
    const sentences = values.map(value => {
      if (value && typeof value === 'object') {
        const key = typeof value.code === 'string' ? value.code : typeof value.reason === 'string' ? value.reason : '';
        value = key || JSON.stringify(value);
      }
      const key = String(value ?? '').trim();
      return key ? (reasonLabels[key] || '需要人工確認（' + key + '）') : '';
    }).filter(Boolean);
    if (!sentences.length) return '未標示原因';
    const spread = Number(row?.candidate_spread ?? row?.candidate_spread_s);
    if (Number.isFinite(spread)) sentences.push('候選相差 ' + spread.toFixed(2) + ' 秒');
    return sentences.join('；');
  };
  const optionsOf = row => {
    if (Array.isArray(row.options) && row.options.length) return row.options;
    // Older servers: fold the raw candidate list into at most two alternatives plus keep.
    const alternatives = (row.candidates || []).filter(c => !c.rejected && !c.diagnostic_only && row.current_cs != null && Math.abs(c.cs - row.current_cs) > 15)
      .sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, 2).sort((a, b) => a.cs - b.cs)
      .map((c, i) => ({cs:c.cs, kind:c.cs < row.current_cs ? 'earlier' : 'later', label:'AB'[i], delta_s:(c.cs - row.current_cs) / 100, support:1 + (c.agree_count || 0), sources:c.sources || [c.label]}));
    return row.current_cs == null ? alternatives : [...alternatives, {cs:row.current_cs, kind:'keep', label:'維持', delta_s:0, support:0, sources:['current']}].sort((a, b) => a.cs - b.cs);
  };
  function setDirty() { state.dirty = state.edits.size > 0; }
  const serverReadOnly = () => state.songs.some(song => song.detail?.server_read_only);
  const editable = song => !song.read_only && !song.detail?.server_read_only;
  function playerKey(item, kind) { return String(item.song.index) + ':' + kind; }
  function unbindAudio(audio) {
    (state.player.handlers.get(audio) || []).forEach(binding => audio.removeEventListener(binding.type, binding.fn));
    state.player.handlers.delete(audio);
  }
  function bindAudio(audio, bindings) {
    unbindAudio(audio);
    bindings.forEach(binding => audio.addEventListener(binding.type, binding.fn, binding.options));
    state.player.handlers.set(audio, bindings);
  }
  function cachedAudio(item, kind) {
    const key = playerKey(item, kind);
    let audio = state.player.audio.get(key);
    if (!audio) {
      audio = new Audio('/audio/' + item.song.index + '/' + kind + '?t=' + encodeURIComponent(token));
      state.player.audio.set(key, audio);
    }
    return audio;
  }
  function stopPlayer() {
    const player = state.player;
    player.seq += 1;
    if (player.timer != null) { clearTimeout(player.timer); player.timer = null; }
    [...player.handlers.keys()].forEach(unbindAudio);
    player.audio.forEach(audio => audio.pause());
    player.active = null;
    player.ab = null;
  }
  function select(item) {
    stopPlayer();
    const index = visible().indexOf(item);
    if (index >= 0) state.selected = index;
  }
  function playbackFailure(message) {
    stopPlayer();
    state.error = message;
    render();
  }
  function finishClip(audio, seq) {
    if (seq !== state.player.seq) return;
    unbindAudio(audio);
    audio.pause();
    if (state.player.timer != null) { clearTimeout(state.player.timer); state.player.timer = null; }
    state.player.active = null;
  }
  async function playAround(item, targetCs, kind=state.mode) {
    if (!item || targetCs == null) return;
    const available = kind === 'stem' ? item.song.has_stem : item.song.has_flac;
    if (!available) { state.error = kind.toUpperCase() + ' audio is unavailable for this song'; render(); return; }
    stopPlayer();
    const seq = state.player.seq;
    const audio = cachedAudio(item, kind);
    const start = targetCs / 100;
    const stop = start + 2;
    let started = false;
    const active = () => seq === state.player.seq;
    const check = () => { if (active() && audio.currentTime >= stop) finishClip(audio, seq); };
    const fail = () => { if (active()) playbackFailure(kind.toUpperCase() + ' audio could not be loaded'); };
    const seekAndPlay = () => {
      if (started || !active()) return;
      started = true;
      audio.currentTime = start;
      if (!active()) return;
      bindAudio(audio, [{type:'timeupdate', fn:check}, {type:'ended', fn:() => finishClip(audio, seq)}, {type:'error', fn:fail}]);
      state.player.active = audio;
      Promise.resolve(audio.play()).catch(() => { if (active()) playbackFailure('audio playback was blocked'); });
      state.player.timer = setTimeout(check, 2250);
    };
    bindAudio(audio, [{type:'loadedmetadata', fn:seekAndPlay}, {type:'error', fn:fail}]);
    if (audio.readyState >= 1) seekAndPlay(); else audio.load();
  }
  function playAB(item, candidate) {
    if (!item || !candidate || candidate.cs == null || candidate.diagnostic_only || item.row.current_cs == null) return;
    const kind = state.mode;
    const available = kind === 'stem' ? item.song.has_stem : item.song.has_flac;
    if (!available) { state.error = kind.toUpperCase() + ' audio is unavailable for this song'; render(); return; }
    stopPlayer();
    const seq = state.player.seq;
    const ab = {item, a_cs:item.row.current_cs, b_cs:candidate.cs, phase:0, kind};
    state.player.ab = ab;
    const active = () => seq === state.player.seq && state.player.ab === ab;
    const next = () => {
      if (!active() || ab.phase >= 8) { if (active()) stopPlayer(); return; }
      const audio = cachedAudio(item, kind);
      const start = (ab.phase % 2 ? ab.b_cs : ab.a_cs) / 100;
      const begin = () => {
        if (!active()) return;
        audio.currentTime = start;
        state.player.active = audio;
        Promise.resolve(audio.play()).catch(() => { if (active()) playbackFailure('audio playback was blocked'); });
        state.player.timer = setTimeout(() => {
          if (!active()) return;
          audio.pause();
          unbindAudio(audio);
          state.player.timer = null;
          ab.phase += 1;
          next();
        }, 2000);
      };
      const fail = () => { if (active()) playbackFailure(kind.toUpperCase() + ' audio could not be loaded'); };
      bindAudio(audio, [{type:'loadedmetadata', fn:begin}, {type:'error', fn:fail}]);
      if (audio.readyState >= 1) begin(); else audio.load();
    };
    next();
  }
  // ---- waveform ----
  function cssVar(name, fallback) { try { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback; } catch (error) { return fallback; } }
  function paintPeaks(canvas, payload, markerCs, marks, message) {
    const context = canvas.getContext?.('2d');
    if (!context) return;
    const width = canvas.width || 600, height = canvas.height || 96;
    try {
      context.clearRect(0, 0, width, height);
      const span = Number(payload?.to_cs) - Number(payload?.from_cs);
      const x = cs => (cs - payload.from_cs) * width / span;
      const ok = Number.isFinite(span) && span > 0;
      const peaks = payload?.peaks || [];
      const bottom = height - 14;
      if (ok && context.fillRect) {
        context.fillStyle = cssVar('--line', '#2a3647');
        for (let t = Math.ceil(payload.from_cs / 50) * 50; t <= payload.to_cs; t += 50) context.fillRect(x(t), bottom - (t % 100 ? 3 : 6), 1, t % 100 ? 3 : 6);
        if (context.fillText) {
          context.fillStyle = cssVar('--fg-3', '#6b7d95'); context.font = '10px ui-monospace, Consolas, monospace'; context.textAlign = 'center';
          for (let t = Math.ceil(payload.from_cs / 100) * 100; t <= payload.to_cs; t += 100) context.fillText(time(t).slice(0, 5), x(t), height - 3);
        }
      }
      context.strokeStyle = cssVar('--wave', '#4f9be6');
      context.lineWidth = 1;
      const mid = bottom / 2;
      peaks.forEach((peak, index) => {
        const px = (index + .5) * width / Math.max(1, peaks.length);
        context.beginPath(); context.moveTo(px, (1 - peak[1]) * mid); context.lineTo(px, (1 - peak[0]) * mid); context.stroke();
      });
      if (ok) {
        const mark = (cs, color, label, dash) => {
          if (cs == null || cs < payload.from_cs || cs > payload.to_cs) return;
          context.strokeStyle = color; context.lineWidth = 2; context.setLineDash?.(dash || []);
          context.beginPath(); context.moveTo(x(cs), 0); context.lineTo(x(cs), bottom); context.stroke(); context.setLineDash?.([]);
          if (label && context.fillText) { context.fillStyle = color; context.font = '600 11px ui-monospace, Consolas, monospace'; context.textAlign = 'left'; context.fillText(label, x(cs) + 4, 13); }
        };
        (marks || []).forEach(m => mark(m.cs, m.color, m.label, m.dash));
        mark(markerCs, cssVar('--accent', '#f2b84b'), '現在');
      }

        catch (error) { return Object.assign({}, song, {rows:[], load_error:error.message, read_only:true}); }

      state.songs = list.map((song,i) => Object.assign({}, song, {has_flac:details[i].has_flac, has_stem:details[i].has_stem, detail:details[i]}));
      state.rows = [];

  document.getElementById('mode').addEventListener('click', event => { event.currentTarget.blur(); stopPlayer(); state.mode = state.mode === 'flac' ? 'stem' : 'flac'; render(); });
  document.getElementById('help-button').addEventListener('click', () => { document.getElementById('help').hidden = false; });
  document.getElementById('help-close').addEventListener('click', () => { document.getElementById('help').hidden = true; });
  document.addEventListener('keydown', event => {
    if (event.ctrlKey && !event.altKey && !event.metaKey && event.key.toLowerCase() === 's') { event.preventDefault(); save(); return; }
    if (event.altKey || event.metaKey || event.ctrlKey) return;
    if (event.key === 'Escape') { document.getElementById('help').hidden = true; return; }
    if (event.key === '?') { event.preventDefault(); document.getElementById('help').hidden = false; return; }
    if (event.target?.closest?.('input,textarea,select,[contenteditable]') && event.target?.type !== 'checkbox') return;
    if (event.target?.closest?.('button') && (event.key === 'Enter' || event.code === 'Space')) return;
    const rows = visible(), item = rows[state.selected];
    if (!item) return;
    if (event.key === 'ArrowDown' || event.key.toLowerCase() === 'j') { event.preventDefault(); state.selected = Math.min(rows.length - 1, state.selected + 1); render(); return; }
    if (event.key === 'ArrowUp') { event.preventDefault(); state.selected = Math.max(0, state.selected - 1); render(); return; }
    if (event.key.toLowerCase() === 'k') { event.preventDefault(); keep(item); return; }
    if (event.key.toLowerCase() === 'u') { event.preventDefault(); state.edits.delete(keyFor(item)); setDirty(); render(); return; }
    if (event.key.toLowerCase() === 'v') { event.preventDefault(); stopPlayer(); state.mode = state.mode === 'flac' ? 'stem' : 'flac'; render(); return; }
    if (event.key.toLowerCase() === 'b') { event.preventDefault(); const chosen = working(item); if (chosen != null && chosen !== item.row.current_cs) playAB(item, {cs:chosen, diagnostic_only:false}); return; }
    if (event.key === 'Tab') { event.preventDefault(); state.details = !state.details; render(); return; }
    if (event.key === 'Enter') { event.preventDefault(); accept(item); return; }
    if (event.code === 'Space') { event.preventDefault(); playAround(item, working(item)); return; }
    if (event.key.toLowerCase() === 'p') { event.preventDefault(); if (item.row.previous) playAround(item, item.row.previous.cs); return; }
    if (event.key.toLowerCase() === 'n') { event.preventDefault(); if (item.row.next) playAround(item, item.row.next.cs); return; }
    if (event.key === '[' || event.key === ']' || event.key === '{' || event.key === '}' || event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      const delta = event.shiftKey ? 1 : 10;
      const earlier = event.key === '[' || event.key === '{' || event.key === 'ArrowLeft';
      const signedDelta = earlier ? -delta : delta;
      nudge(item, signedDelta);
      return;
    }
    if (/^[1-3]$/.test(event.key)) {
      event.preventDefault();
      const options = optionsOf(item.row);
      const option = event.key === '3' ? options.find(o => o.kind === 'keep') : options.filter(o => o.kind !== 'keep')[Number(event.key) - 1];
      if (option) pickOption(item, option);
    }
  });

  addEventListener('beforeunload', event => { if (state.dirty) { event.preventDefault(); event.returnValue = ''; } });
  load();
})();
</script>
</body>
</html>
