<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>LRC review</title>
<style>
:root{font:14px system-ui,sans-serif;color:#e5edf7;background:#0b1220;color-scheme:dark}
body{margin:0;min-height:100vh;background:#0b1220}header{position:sticky;top:0;background:#101a2b;border-bottom:1px solid #293852;padding:10px 16px;z-index:2}
button{font:inherit;padding:5px 8px;cursor:pointer;color:#e5edf7;background:#17253a;border:1px solid #3a4d6b;border-radius:5px}button:hover:not(:disabled){background:#203653}button:disabled{cursor:not-allowed;opacity:.45}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{color:#a9bad0}.warning{color:#ff9b9b}
.queue{max-width:1100px;margin:12px auto}.song{background:#111c2e;border:1px solid #293852;border-radius:8px;margin:10px 0;overflow:hidden;box-shadow:0 6px 20px #05091466}
.song-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.song-tab.active{background:#285987;border-color:#8cc7f7}
.song h2{font-size:15px;margin:0;padding:10px;background:#17243a}.row{padding:10px;border-top:1px solid #25344c}
.row.review{border-left:4px solid #ff6b6b}.row.untrusted{border-left:4px solid #e4ad45}
.meta{color:#9fb0c7;font-size:12px}.lyric{font-size:16px;margin:4px 0 8px;white-space:pre-wrap;color:#f4f7fb}
.severity-badge{display:inline-block;padding:1px 5px;border:1px solid #49617e;border-radius:10px;background:#20324b;color:#c8dbf1;font-size:11px}
.chips,.audio{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:6px 0}
.candidate{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid #3a4d6b;border-radius:6px;padding:6px 8px;background:#142136}
.candidate.selected{background:#163d62;border-color:#5da9ee}.candidate.rejected{text-decoration:line-through;color:#8291a5}
.candidate-info{min-width:300px;line-height:1.5}.candidate-source{color:#d4e2f2}.candidate-delta{color:#9fb8d4;font-variant-numeric:tabular-nums}.candidate-actions{display:flex;gap:4px}.candidate-action{padding:3px 6px}
.dirty{background:#5d4b1d}.muted{color:#8291a5}.order-warning{color:#ff9b9b;font-weight:600}
.selected-row{outline:2px solid #5da9ee;outline-offset:-2px}.row.conflict{background:#321d28;border-left-color:#ff6b6b}
</style>
</head>
<body>
<header>
  <div class="toolbar"><button id="save">Save</button><span id="server-mode" class="muted"></span><label><input id="untrusted" type="checkbox"> show UNTRUSTED</label><button id="mode">V: FLAC</button><span id="status" class="status">loading</span></div>
  <div class="meta">Keys: Up/Down row · 1-9 pick/play · [ ] nudge · Space play · P/N adjacent line · V audio · Enter accept/next · K keep/next · U undo · Ctrl+S save</div>
</header>
<main id="queue" class="queue"></main>
<script>
(() => {
  const token = new URLSearchParams(location.search).get('t') || new URLSearchParams(location.hash.slice(1)).get('t');
  const queue = document.getElementById('queue');
  const status = document.getElementById('status');
  const state = {songs:[], rows:[], edits:new Map(), dirty:false, selected:0, activeSong:null, showUntrusted:false, mode:'flac', player:{audio:new Map(), handlers:new Map(), seq:0, timer:null, active:null, ab:null}, error:''};
  const api = async (path, options={}) => {
    const headers = Object.assign({'X-Review-Token':token}, options.headers || {});
    const response = await fetch(path, Object.assign({}, options, {headers}));
    const data = await response.json().catch(() => ({error:response.statusText}));
    if (!response.ok) throw Error(data.error || response.statusText);
    return data;
  };
  const time = cs => cs == null ? '—' :
    String(Math.floor(cs/6000)).padStart(2,'0') + ':' + String(Math.floor(cs%6000/100)).padStart(2,'0') + '.' + String(cs%100).padStart(2,'0');
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const visible = () => state.rows.filter(item => (state.activeSong == null || item.song.index === state.activeSong) && (item.row.review === 'REVIEW' || state.showUntrusted));
  const keyFor = item => String(item.song.index) + ':' + String(item.row.entry);
  const editFor = item => state.edits.get(keyFor(item));
  const conflicted = item => { const edit = editFor(item); return !!edit && edit.base_cs !== item.row.current_cs; };
  const working = item => editFor(item)?.cs ?? item.row.current_cs;
  const adjacentText = value => value ? time(value.cs) + ' · ' + esc(value.lyric || '') : '—';
  const sourceText = c => (c.sources || [c.label]).join(',');
  const sourceLabel = source => ({
    'audio-validated-current':'audio-checked result', auto:'current result', current:'current result',
    'raw_asr':'ASR diagnostic hint', 'precentral-recommendation':'ASR diagnostic hint',
    'ctc-acoustic-backtrack':'CTC audio candidate', 'ctc-current':'CTC current candidate',
    'ctc-first-token':'CTC first-sound candidate', 'ctc-first-token-posterior':'CTC first-sound (posterior)',
    'ctc-joint-boundary-consensus':'CTC boundary candidate', 'ctc-local-window':'CTC local-window candidate',
    'ctc-local-window-wide':'CTC wide-window candidate', 'ctc-nearby-phonetic-peak':'nearby sound candidate',
    'ctc-opening-local-retry':'opening retry candidate', 'ctc-opening-vocal-fusion':'opening voice candidate',
    'ctc-vocal-activity-reentry':'voice re-entry candidate', 'ctc-vocal-onset-confirmed':'voice-onset candidate'
  }[source] || String(source || 'candidate').replace(/^ctc-/, 'CTC ').replace(/-/g, ' '));
  const sourceLabels = c => (c.sources || [c.label]).map(sourceLabel).join(', ');
  const reasonLabels = {
    'F1-vocal-absent':'人聲缺失', 'F3-compressed-or-nonmonotonic':'歌詞時間壓縮或非單調',
    'F3-nonmonotonic':'歌詞時間非單調', 'F4-ctc-final-disagreement':'CTC 最終時間不一致',
    'candidate_disagreement':'候選時間不一致', 'ctc_confidence_collapse':'CTC 信心塌陷',
    'ctc_zero_gap_compressed_prefix':'CTC 零間隔壓縮前綴', 'duplicate_occurrence_offset_mismatch':'重複段落偏移不一致',
    'group_placement_unsupported':'分組定位無法支援', 'insufficient-minimum-proof':'最低證據不足',
    'model-disagreement':'模型結果不一致', 'no-strict-opening-proof':'缺少嚴格起音證據',
    'nonmonotonic-line-start':'行起點非單調', 'phonetic_anchor_disagreement':'語音錨點不一致',
    'previous-tail-overlap':'前行尾端重疊', 'previous-tail-ownership-unknown':'前行尾端歸屬不明',
    'recurrence-uncorroborated':'重複段落未獲交叉驗證', 'silent-risk:selected-confidence-le-0.8-and-next-gap-ge-19':'低信心且後方間隔過大',
    'tail-conflict-without-independent-current-opening':'尾端衝突且缺少目前行獨立起音', 'temporal-incoherence':'時間關係不一致',
    'timing-evidence-unverified':'時間證據未驗證', 'unresolved-material-alternative':'仍有重大候選未解決',
    'unresolved-precentral-disagreement':'前置模型仍有不一致', 'unresolved_raw_ctc_disagreement':'Raw ASR 與 CTC 仍有不一致',
    'unverified':'尚未驗證'
  };
  const reasonText = (codes, row) => {
    const values = Array.isArray(codes) ? codes : codes == null ? [] : [codes];
    const sentences = values.map(value => {
      if (value && typeof value === 'object') {
        const key = typeof value.code === 'string' ? value.code : typeof value.reason === 'string' ? value.reason : '';
        value = key || JSON.stringify(value);
      }
      const key = String(value ?? '').trim();
      return key ? (reasonLabels[key] || '需要人工確認（' + key + '）') : '';
    }).filter(Boolean);
    if (!sentences.length) return '未標示原因';
    const spread = Number(row?.candidate_spread ?? row?.candidate_spread_s);
    if (Number.isFinite(spread)) sentences.push('候選相差 ' + spread.toFixed(2) + ' 秒');
    return sentences.join('；');
  };
  function setDirty() { state.dirty = state.edits.size > 0; }
  const serverReadOnly = () => state.songs.some(song => song.detail?.server_read_only);
  const editable = song => !song.read_only && !song.detail?.server_read_only;
  function playerKey(item, kind) { return String(item.song.index) + ':' + kind; }
  function unbindAudio(audio) {
    (state.player.handlers.get(audio) || []).forEach(binding => audio.removeEventListener(binding.type, binding.fn));
    state.player.handlers.delete(audio);
  }
  function bindAudio(audio, bindings) {
    unbindAudio(audio);
    bindings.forEach(binding => audio.addEventListener(binding.type, binding.fn, binding.options));
    state.player.handlers.set(audio, bindings);
  }
  function cachedAudio(item, kind) {
    const key = playerKey(item, kind);
    let audio = state.player.audio.get(key);
    if (!audio) {
      audio = new Audio('/audio/' + item.song.index + '/' + kind + '?t=' + encodeURIComponent(token));
      state.player.audio.set(key, audio);
    }
    return audio;
  }
  function stopPlayer() {
    const player = state.player;
    player.seq += 1;
    if (player.timer != null) { clearTimeout(player.timer); player.timer = null; }
    [...player.handlers.keys()].forEach(unbindAudio);
    player.audio.forEach(audio => audio.pause());
    player.active = null;
    player.ab = null;
  }
  function select(item) {
    stopPlayer();
    const index = visible().indexOf(item);
    if (index >= 0) state.selected = index;
  }
  function playbackFailure(message) {
    stopPlayer();
    state.error = message;
    render();
  }
  function finishClip(audio, seq) {
    if (seq !== state.player.seq) return;
    unbindAudio(audio);
    audio.pause();
    if (state.player.timer != null) { clearTimeout(state.player.timer); state.player.timer = null; }
    state.player.active = null;
  }
  async function playAround(item, targetCs, kind=state.mode) {
    if (!item || targetCs == null) return;
    const available = kind === 'stem' ? item.song.has_stem : item.song.has_flac;
    if (!available) { state.error = kind.toUpperCase() + ' audio is unavailable for this song'; render(); return; }
    stopPlayer();
    const seq = state.player.seq;
    const audio = cachedAudio(item, kind);
    const start = targetCs / 100;
    const stop = start + 2;
    let started = false;
    const active = () => seq === state.player.seq;
    const check = () => { if (active() && audio.currentTime >= stop) finishClip(audio, seq); };
    const fail = () => { if (active()) playbackFailure(kind.toUpperCase() + ' audio could not be loaded'); };
    const seekAndPlay = () => {
      if (started || !active()) return;
      started = true;
      audio.currentTime = start;
      if (!active()) return;
      bindAudio(audio, [{type:'timeupdate', fn:check}, {type:'ended', fn:() => finishClip(audio, seq)}, {type:'error', fn:fail}]);
      state.player.active = audio;
      Promise.resolve(audio.play()).catch(() => { if (active()) playbackFailure('audio playback was blocked'); });
      state.player.timer = setTimeout(check, 2250);
    };
    bindAudio(audio, [{type:'loadedmetadata', fn:seekAndPlay}, {type:'error', fn:fail}]);
    if (audio.readyState >= 1) seekAndPlay(); else audio.load();
  }
  function playAB(item, candidate) {
    if (!item || !candidate || candidate.cs == null || candidate.diagnostic_only || item.row.current_cs == null) return;
    const kind = state.mode;
    const available = kind === 'stem' ? item.song.has_stem : item.song.has_flac;
    if (!available) { state.error = kind.toUpperCase() + ' audio is unavailable for this song'; render(); return; }
    stopPlayer();
    const seq = state.player.seq;
    const ab = {item, a_cs:item.row.current_cs, b_cs:candidate.cs, phase:0, kind};
    state.player.ab = ab;
    const active = () => seq === state.player.seq && state.player.ab === ab;
    const next = () => {
      if (!active() || ab.phase >= 8) { if (active()) stopPlayer(); return; }
      const audio = cachedAudio(item, kind);
      const start = (ab.phase % 2 ? ab.b_cs : ab.a_cs) / 100;
      const begin = () => {
        if (!active()) return;
        audio.currentTime = start;
        state.player.active = audio;
        Promise.resolve(audio.play()).catch(() => { if (active()) playbackFailure('audio playback was blocked'); });
        state.player.timer = setTimeout(() => {
          if (!active()) return;
          audio.pause();
          unbindAudio(audio);
          state.player.timer = null;
          ab.phase += 1;
          next();
        }, 2000);
      };
      const fail = () => { if (active()) playbackFailure(kind.toUpperCase() + ' audio could not be loaded'); };
      bindAudio(audio, [{type:'loadedmetadata', fn:begin}, {type:'error', fn:fail}]);
      if (audio.readyState >= 1) begin(); else audio.load();
    };
    next();
  }
  function stage(item, cs, source, nudgeCs) {
    stopPlayer();
    if (!editable(item.song) || cs == null) return;
    const key = keyFor(item), current = item.row.current_cs;
    if (current != null && cs === current) {
      state.edits.delete(key);
      state.error = ''; setDirty(); render();
      return;
    }
    state.edits.set(key, {entry:item.row.entry, cs, source:String(source || 'manual').slice(0,64), nudge_cs:nudgeCs, base_cs:item.row.current_cs});
    state.error = ''; setDirty(); render();
  }
  function stageCandidate(item, candidate) {
    if (candidate?.diagnostic_only) return;
    select(item);
    stage(item, candidate.cs, sourceText(candidate), 0);
    playAround(item, candidate.cs);
  }
  function applyCandidate(item, candidate) {
    if (candidate?.diagnostic_only) return;
    select(item);
    stage(item, candidate.cs, sourceText(candidate), 0);
  }
  function nudge(item, deltaCs) {
    if (!editable(item.song)) return;
    if (conflicted(item)) {
      alert('This timestamp changed after staging. Repick a candidate or press U before nudging.');
      return;
    }
    const before = working(item) || 0;
    const cs = Math.max(0, before + deltaCs);
    const actualDelta = cs - before;
    const existing = editFor(item);
    stage(item, cs, existing?.source || 'nudge', (existing?.nudge_cs || 0) + actualDelta);
    playAround(item, cs);
  }
  function nextRow() {
    const rows = visible();
    if (rows.length) { state.selected = Math.min(rows.length - 1, state.selected + 1); render(); }
  }
  function render() {
    stopPlayer();
    if (state.activeSong == null && state.songs.length) state.activeSong = state.songs[0].index;
    if (state.activeSong != null && !state.songs.some(song => song.index === state.activeSong)) state.activeSong = state.songs[0]?.index ?? null;
    const rows = visible();
    state.selected = Math.min(state.selected, Math.max(0, rows.length - 1));
    queue.innerHTML = '';
    const tabs = document.createElement('nav');
    tabs.className = 'song-tabs';
    state.songs.forEach(song => {
      const pending = state.rows.filter(item => item.song.index === song.index && item.row.review === 'REVIEW').length;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'song-tab' + (song.index === state.activeSong ? ' active' : '');
      button.textContent = song.song + ' (' + pending + ')';
      button.addEventListener('click', () => { state.activeSong = song.index; state.selected = 0; render(); });
      tabs.appendChild(button);
    });
    queue.appendChild(tabs);
    const grouped = new Map();
    rows.forEach(item => { if (!grouped.has(item.song.index)) grouped.set(item.song.index, []); grouped.get(item.song.index).push(item); });
    const shownSongs = new Set();
    grouped.forEach(items => {
      const box = document.createElement('section');
      box.className = 'song';
      shownSongs.add(items[0].song.index);
      const r2 = items[0].song.detail?.r2;
      const r2Notice = r2?.skipped ? ' <span class="meta">R2 skipped: ' + esc(r2.reason || 'unknown') + '</span>' : '';
      box.innerHTML = '<h2>' + esc(items[0].song.song) + r2Notice + ' <span class="meta">' + items.length + ' flagged rows</span></h2>';
      items.forEach(item => box.appendChild(rowElement(item)));
      queue.appendChild(box);
    });
    state.songs.filter(song => song.index === state.activeSong && !shownSongs.has(song.index)).forEach(song => {
      const box = document.createElement('section');
      box.className = 'song';
      const r2 = song.detail?.r2;
      const r2Notice = r2?.skipped ? ' <span class="meta">R2 skipped: ' + esc(r2.reason || 'unknown') + '</span>' : '';
      const error = song.detail?.load_error ? '<div class="warning error-row">load error: ' + esc(song.detail.load_error) + '</div>' : '';
      box.innerHTML = '<h2>' + esc(song.song) + r2Notice + ' <span class="meta">0 flagged rows</span></h2>' + error;
      queue.appendChild(box);
    });
    const globalReadOnly = serverReadOnly();
    status.textContent = state.error || rows.length + ' visible / ' + state.rows.length + ' total' + (state.dirty ? ' · unsaved' : '') + ' · ' + state.mode;
    status.className = state.error ? 'warning' : state.dirty ? 'status dirty' : 'status';
    document.getElementById('save').disabled = globalReadOnly || !state.dirty;
    document.getElementById('server-mode').textContent = globalReadOnly ? 'server read-only' : '';
    document.getElementById('mode').textContent = 'V: ' + state.mode.toUpperCase();
  }
  function rowElement(item) {
    const song = item.song, row = item.row, edit = editFor(item), chosen = working(item), div = document.createElement('article');
    const key = keyFor(item), previous = row.previous, next = row.next, previousCs = previous?.cs, nextCs = next?.cs;
    const ordering = chosen != null && ((previousCs != null && chosen <= previousCs) || (nextCs != null && chosen >= nextCs));
    const lyrics = (row.lyrics || [row.lyric || '']).map(esc).join('<br>');
    const extraCandidates = row.extra_candidates || [];
    const candidateMarkup = (c, i, listName, numbered) => {
      const delta = row.current_cs == null ? '—' : (c.cs - row.current_cs >= 0 ? '+' : '') + ((c.cs - row.current_cs) / 100).toFixed(2) + 's';
      const source = sourceLabels(c);
      const marker = c.cs === row.current_cs ? ' · current' : '';
      const diagnostic = c.diagnostic_only ? ' · diagnostic only' : '';
      const agreement = c.agree_count ? ' · +' + c.agree_count + ' candidates within ±0.15s' : '';
      const number = numbered ? (i + 1) + '. ' : '';
      const label = numbered ? ' candidate ' + (i + 1) : ' candidate';
      return '<div class="candidate ' + (c.rejected ? 'rejected ' : '') + (c.cs === chosen ? 'selected' : '') + '">' +
        '<span class="candidate-info"><b>' + number + time(c.cs) + marker + '</b> · <span class="candidate-source">' + esc(source) + '</span><span class="candidate-delta"> · from current ' + esc(delta) + '</span>' + agreement + diagnostic + (c.rejected ? ' · rejected' : '') + '</span>' +
        '<span class="candidate-actions"><button type="button" class="candidate-action candidate-play" data-candidate-list="' + listName + '" data-candidate="' + i + '" aria-label="listen to' + label + '">listen</button>' +
        '<button type="button" class="candidate-action candidate-apply" data-candidate-list="' + listName + '" data-candidate="' + i + '"' + (editable(song) && !c.diagnostic_only ? '' : ' disabled') + ' aria-label="apply' + label + '">apply</button></span></div>';
    };
    const candidates = row.candidates || [];
    const chips = candidates.map((c,i) => candidateMarkup(c, i, 'main', true)).join('');
    const extras = extraCandidates.map((c,i) => candidateMarkup(c, i, 'extra', false)).join('');
    const extraMarkup = extraCandidates.length ? '<details class="extra-candidates"><summary>還有 ' + extraCandidates.length + ' 個候選</summary><div class="chips">' + extras + '</div></details>' : '';
    const selectedCandidate = [...candidates, ...extraCandidates].find(candidate => candidate.cs === chosen && candidate.cs !== row.current_cs && !candidate.diagnostic_only);
    const selectedCandidateList = selectedCandidate && candidates.includes(selectedCandidate) ? 'main' : 'extra';
    const selectedCandidateIndex = selectedCandidate ? (selectedCandidateList === 'main' ? candidates.indexOf(selectedCandidate) : extraCandidates.indexOf(selectedCandidate)) : '';
    const conflict = conflicted(item);
    div.className = 'row ' + String(row.review || 'UNTRUSTED').toLowerCase() + (conflict ? ' conflict' : '') + (visible()[state.selected] === item ? ' selected-row' : '');
    div.dataset.key = key;
    const severity = '<span class="severity-badge">severity ' + esc(row.severity_score ?? 0) + ' · rank ' + esc(row.severity_rank ?? '—') + '</span>';
    div.innerHTML = '<div class="meta">' + esc(song.song) + ' · entry ' + row.entry + ' · ' + esc(row.review) + ' · ' + severity + ' · ' + esc(reasonText(row.reason_codes, row)) + '</div>' +
      '<div class="lyric">' + (lyrics || '<span class="muted">no lyric text</span>') + '</div>' +
      '<div>current <b>' + time(row.current_cs) + '</b> · auto ' + time(row.auto_cs) + ' · previous ' + adjacentText(previous) + ' · next ' + adjacentText(next) + '</div>' +
      (ordering ? '<div class="order-warning">warning: working time is outside adjacent line order</div>' : '') +
      (conflict ? '<div class="order-warning">conflict: timestamp changed; repick a candidate or press U</div>' : '') +
      '<div class="audio"><button class="play" data-kind="flac" ' + (song.has_flac ? '' : 'disabled') + '>play FLAC</button><button class="play" data-kind="stem" ' + (song.has_stem ? '' : 'disabled') + '>play stem</button><button type="button" class="ab-play" data-candidate-list="' + selectedCandidateList + '" data-candidate="' + selectedCandidateIndex + '"' + (selectedCandidate && (state.mode === 'stem' ? song.has_stem : song.has_flac) ? '' : ' disabled') + ' aria-label="alternate current and selected candidate">A/B</button><span class="nudge"><button type="button" class="nudge-button" data-delta="-10"' + (editable(song) ? '' : ' disabled') + ' aria-label="move timestamp earlier by 0.1 seconds">-0.1</button><button type="button" class="nudge-button" data-delta="10"' + (editable(song) ? '' : ' disabled') + ' aria-label="move timestamp later by 0.1 seconds">+0.1</button></span>' + (song.has_flac ? '' : '<span class="muted">FLAC unavailable</span>') + (song.has_stem ? '' : '<span class="muted">stem unavailable</span>') + '</div>' +
      '<div>working <b>' + time(chosen) + '</b></div><div class="chips">' + (chips || '<span class="muted">no candidates</span>') + '</div>' + extraMarkup +
      '<div class="meta">' + ((song.read_only || song.detail?.server_read_only) ? 'read-only: ' + esc(song.read_only_reason || (song.detail?.server_read_only ? 'server' : 'unknown')) : '') + '</div>';
    div.addEventListener('click', () => { select(item); render(); });
    div.querySelectorAll('.play').forEach(button => button.addEventListener('click', event => { event.stopPropagation(); button.blur(); playAround(item, working(item), button.dataset.kind); }));
    div.querySelectorAll('.candidate-play').forEach(button => button.addEventListener('click', event => {
      event.stopPropagation(); button.blur(); const list = button.dataset.candidateList === 'extra' ? extraCandidates : candidates; const candidate = list[Number(button.dataset.candidate)]; if (candidate) playAround(item, candidate.cs);
    }));
    div.querySelectorAll('.candidate-apply').forEach(button => button.addEventListener('click', event => {
      event.stopPropagation(); button.blur(); const list = button.dataset.candidateList === 'extra' ? extraCandidates : candidates; const candidate = list[Number(button.dataset.candidate)]; if (candidate && editable(song)) applyCandidate(item, candidate);
    }));
    div.querySelectorAll('.ab-play').forEach(button => button.addEventListener('click', event => {
      event.stopPropagation(); button.blur(); const list = button.dataset.candidateList === 'extra' ? extraCandidates : candidates; const candidate = list[Number(button.dataset.candidate)]; if (candidate) playAB(item, candidate);
    }));
    div.querySelectorAll('.nudge-button').forEach(button => button.addEventListener('click', event => {
      event.stopPropagation(); button.blur(); nudge(item, Number(button.dataset.delta));
    }));
    return div;
  }
  async function load() {
    try {
      const previousEdits = new Map(state.edits);
      const list = await api('/api/songs');
      const details = await Promise.all(list.map(async song => {
        try { return await api('/api/song/' + song.index); }
        catch (error) { return Object.assign({}, song, {rows:[], load_error:error.message, read_only:true}); }
      }));
      state.songs = list.map((song,i) => Object.assign({}, song, {has_flac:details[i].has_flac, has_stem:details[i].has_stem, detail:details[i]}));
      state.rows = [];
      state.songs.forEach(song => (song.detail.rows || []).forEach(row => state.rows.push({song,row})));
      state.rows.sort((a,b) => a.song.index - b.song.index || a.row.entry - b.row.entry);
      const currentRows = new Map(state.rows.map(item => [keyFor(item), item]));
      let dropped = 0;
      previousEdits.forEach((edit,key) => {
        const item = currentRows.get(key);
        if (!item || !editable(item.song)) { state.edits.delete(key); dropped++; }
      });
      setDirty();
      state.error = dropped ? dropped + ' dropped staged edit' + (dropped === 1 ? '' : 's') + ' after reload' : '';
      render();
    } catch (error) { state.error = error.message; render(); }
    return state.error;
  }
  async function save() {
    stopPlayer();
    if (serverReadOnly()) { state.error = 'save disabled: server read-only'; render(); return; }
    if (!state.dirty) return;
    const bySong = new Map();
    state.edits.forEach((edit,key) => { const index = Number(key.split(':')[0]); if (!bySong.has(index)) bySong.set(index, []); bySong.get(index).push(edit); });
    const failures = [];
    for (const [index, edits] of bySong) {
      try {
        const song = state.songs.find(item => item.index === index);
        const conflicts = edits.filter(edit => {
          const item = state.rows.find(row => row.song.index === index && row.row.entry === edit.entry);
          return !item || edit.base_cs !== item.row.current_cs;
        });
        if (conflicts.length) { failures.push(song.song + ': staged edit conflicts with current timestamp; repick or U before save'); continue; }
        const response = await fetch('/api/song/' + index + '/save', {
          method:'POST',
          headers:{'X-Review-Token':token, 'Origin':location.origin, 'Content-Type':'application/json'},
          body:JSON.stringify({base_sha256:song.detail.base_sha256, edits:edits.map(({base_cs,...edit}) => edit)})
        });
        const data = await response.json().catch(() => ({error:response.statusText}));
        if (response.status === 409) {
          failures.push(song.song + ': save failed: stale base_sha256; reloaded and kept staged edits');
          continue;
        }
        if (!response.ok) { failures.push(song.song + ': save failed: ' + (data.error || response.statusText)); continue; }
        edits.forEach(edit => state.edits.delete(String(index) + ':' + edit.entry));
        song.detail = data;
      } catch (error) {
        failures.push('song ' + index + ': save failed: ' + error.message);
      }
    }
    setDirty();
    const loadMessage = await load();
    if (loadMessage) failures.push(loadMessage);
    state.error = failures.join('; '); setDirty(); render();
  }

  document.getElementById('save').addEventListener('click', event => { event.currentTarget.blur(); save(); });
  document.getElementById('untrusted').addEventListener('change', event => { state.showUntrusted = event.target.checked; render(); });
  document.getElementById('mode').addEventListener('click', event => { event.currentTarget.blur(); stopPlayer(); state.mode = state.mode === 'flac' ? 'stem' : 'flac'; render(); });
  document.addEventListener('keydown', event => {
    if (event.ctrlKey && !event.altKey && !event.metaKey && event.key.toLowerCase() === 's') { event.preventDefault(); save(); return; }
    if (event.altKey || event.metaKey || event.ctrlKey) return;
    if (event.target?.closest?.('input,textarea,select,[contenteditable]') && event.target?.type !== 'checkbox') return;
    if (event.target?.closest?.('button') && (event.key === 'Enter' || event.code === 'Space')) return;
    const rows = visible(), item = rows[state.selected];
    if (!item) return;
    if (event.key === 'ArrowDown' || event.key.toLowerCase() === 'j') { event.preventDefault(); state.selected = Math.min(rows.length - 1, state.selected + 1); render(); return; }
    if (event.key === 'ArrowUp') { event.preventDefault(); state.selected = Math.max(0, state.selected - 1); render(); return; }
    if (event.key.toLowerCase() === 'k') { event.preventDefault(); state.edits.delete(keyFor(item)); setDirty(); nextRow(); return; }
    if (event.key.toLowerCase() === 'u') { event.preventDefault(); state.edits.delete(keyFor(item)); setDirty(); render(); return; }
    if (event.key.toLowerCase() === 'v') { event.preventDefault(); stopPlayer(); state.mode = state.mode === 'flac' ? 'stem' : 'flac'; render(); return; }
    if (event.key === 'Enter') {
      event.preventDefault();
      if (!editFor(item) && working(item) != null && working(item) !== item.row.current_cs) stage(item, working(item), 'accepted', 0);
      nextRow();
      return;
    }
    if (event.code === 'Space') { event.preventDefault(); playAround(item, working(item)); return; }
    if (event.key.toLowerCase() === 'p') { event.preventDefault(); if (item.row.previous) playAround(item, item.row.previous.cs); return; }
    if (event.key.toLowerCase() === 'n') { event.preventDefault(); if (item.row.next) playAround(item, item.row.next.cs); return; }
    if (event.key === '[' || event.key === ']' || event.key === '{' || event.key === '}') {
      event.preventDefault();
      const delta = event.shiftKey ? 1 : 10;
      const signedDelta = event.key === '[' || event.key === '{' ? -delta : delta;
      nudge(item, signedDelta);
      return;
    }
    if (/^[1-9]$/.test(event.key)) {
      const candidate = item.row.candidates?.[Number(event.key) - 1];
      if (candidate && editable(item.song) && !candidate.diagnostic_only) stageCandidate(item, candidate);
    }
  });

  addEventListener('beforeunload', event => { if (state.dirty) { event.preventDefault(); event.returnValue = ''; } });
  load();
})();
</script>
</body>
</html>
