name: Public checks

on:
  push:
  pull_request:

jobs:
  public-safe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install lightweight dependencies
        run: python -m pip install -r requirements.txt
      - name: Run public-safe checks
        shell: pwsh
        run: |
          python scripts/check_public.py 2>&1 | Tee-Object -FilePath public-checks.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Surface the failing tail as an annotation so it is readable from the API as well as the log.
            $tail = (Get-Content public-checks.log -Tail 60) -join '%0A'
            Write-Output "::error title=public-safe checks failed::$tail"
            exit $code
          }
